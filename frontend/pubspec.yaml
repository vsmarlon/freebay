name: freebay
description: "FreeBay — C2C Hybrid Marketplace"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  go_router: ^15.1.2

  flutter_riverpod: ^2.6.1

  dio: ^5.8.0+1

  shared_preferences: ^2.5.3

  cached_network_image: ^3.4.1
  flutter_svg: ^2.1.0
  image: ^4.8.0
  image_picker: ^1.1.2
  camera: ^0.12.0

  intl: ^0.20.2
  share_plus: ^13.2.0

  local_auth: ^2.3.0

  web_socket_channel: ^3.0.3
  socket_io_client: ^3.0.2
  flutter_secure_storage: ^10.0.0
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^2.6.1
  dartz: ^0.10.1
  animated_tree_view: ^2.3.0
  json_annotation: ^4.12.0
  equatable: ^2.1.0

  freezed_annotation: ^3.1.0

  connectivity_plus: ^6.1.1

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  photo_view: ^0.15.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1

  firebase_core: ^4.4.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.11.1
  json_serializable: ^6.13.0
  freezed: ^3.2.5

flutter:
  uses-material-design: true
  assets:
    - assets/freebay-removebg-preview.png
    - assets/freebay-textonly.png

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk[wght].ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter[opsz,wght].ttf
