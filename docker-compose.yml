version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: freebay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-freebay_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-freebay_secret_password}
      POSTGRES_DB: ${DB_NAME:-freebay_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-freebay_user} -d ${DB_NAME:-freebay_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: freebay-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-freebay_redis_secret}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-freebay_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./nest-backend
      dockerfile: Dockerfile
    container_name: freebay-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-freebay_user}:${DB_PASSWORD:-freebay_secret_password}@postgres:5432/${DB_NAME:-freebay_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-freebay_redis_secret}
      JWT_SECRET: ${JWT_SECRET:-super_secure_production_jwt_secret_key_freebay_2026}
      JWT_EXPIRATION: 86400s
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  redisdata:
  uploads:
