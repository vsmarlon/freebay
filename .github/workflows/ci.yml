name: FreeBay CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-ci:
    name: Backend CI (NestJS / Prisma / Postgres / Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: freebay_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: nest-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: nest-backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: nest-backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/freebay_test_db?schema=public
        run: npx prisma generate

      - name: Typecheck Backend (TypeScript)
        working-directory: nest-backend
        run: npx tsc --noEmit

      - name: Run Backend Unit & Integration Tests
        working-directory: nest-backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/freebay_test_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test_jwt_secret_for_ci_pipeline_2026
        run: npm test -- --passWithNoTests

  frontend-ci:
    name: Frontend CI (Flutter / Dart)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: frontend
        run: flutter analyze

      - name: Run Flutter Widget & Unit Tests
        working-directory: frontend
        run: flutter test
